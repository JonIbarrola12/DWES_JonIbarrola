<html>
<head>
    <title>Formulario de Alumnos</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <h1>
        Formulario de Gestion de Alumnos 
    </h1>
    <br>
    <div class="formulario">
        <form method="post" action="php/index.php">
        <div class="itemForm">
            <label>Nombre:</label>
            <input class="textInput" type="text" name="nombre" required>
            <br>
        </div>
        <div class="itemForm">
            <label>Apellidos:</label>
            <input class="textInput" type="text" name="apellidos" required>
            <br>
        </div>
        <div class="itemForm">
            <label>Fecha de Nacimiento:</label>
            <input class="textInput" type="date" name="fecha" required>
            <br>
        </div>
        <div class="itemForm">
            <label>Curso:</label>
            <div class="cursos">
                <input type="radio" name="curso" value="1º Eso">
                    1º ESO
                <br>
                <input type="radio" name="curso" value="2º ESO">
                    2º ESO
                <br>
                <input type="radio" name="curso" value="3º ESO">
                    3º ESO
                <br>
                <input type="radio" name="curso" value="4º ESO">
                    4º ESO
                <br>
            </div>
        </div>
        
        <div class="itemForm">
            <label>Email de Educamos:</label>
                <input class="textInput" type="text" name="email" required>
                <br>
        </div>
        <div class="itemForm">
            <label>Contraseña de Educamos:</label>
            <input class="textInput" type="password" name="contraseña" required>
            <br>
        </div>
        <div class="divBotones">
            <input class="enviar" type="submit" name="enviar">
            <a class="mostrarTabla" href="php/tabla.php">Ver Alumnos</a>
        </div>
    </form>
    </div>
    <br>
</body>


</html>
